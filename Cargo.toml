[workspace]
resolver = "2"
members = ["crates/kabul-core", "crates/kabul-cli", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.8"
toml = "0.8"
