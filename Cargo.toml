[workspace]
resolver = "2"
members = ["crates/kabul-core", "crates/kabul-cli", "crates/kabuld", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2021"
version = "0.9.0"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.8"
toml = "0.8"

# Release (app, kabuld e CLI): LTO completo e uma unidade de geração (binário menor e mais rápido;
# o build fica mais lento, mas só acontece no empacotamento) e símbolos removidos.
# `panic` continua "unwind": o kabuld responde erro quando um comando entra em pânico (tokio
# `spawn_blocking` → JoinError) e cada conversa roda numa thread própria; com "abort" um pânico
# numa delas derrubaria o app inteiro.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Medição (benchmarks e `kabul loadtest`): otimizado como o release, mas sem LTO e com várias
# unidades, para compilar rápido no CI e em máquina carregada (`cargo bench --profile perf`).
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
incremental = false

[profile.bench]
lto = false
codegen-units = 16
strip = false
