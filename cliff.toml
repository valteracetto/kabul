# git-cliff (https://git-cliff.org): CHANGELOG.md from Conventional Commits.
#
#   npx git-cliff --unreleased --tag v0.10.0 --prepend CHANGELOG.md   # before tagging a release
#   npx git-cliff --unreleased                                       # preview
#
# Commits before v0.9.0 were not conventional; 0.9.0 is a hand-written summary in CHANGELOG.md.
# See CONTRIBUTING.md › Releases.

[changelog]
header = """
# Changelog

All notable changes to Kabul are documented here. The project follows [Semantic Versioning](https://semver.org)
and [Conventional Commits](https://www.conventionalcommits.org); this file is generated by
[git-cliff](https://git-cliff.org) (`cliff.toml`). Entries are written in the language of the commit.

Todas as mudanças relevantes do Kabul ficam aqui (SemVer + Conventional Commits, gerado pelo git-cliff).
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{% if commit.breaking %}**[breaking]** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "<!-- 0 -->Features · Novidades" },
  { message = "^fix", group = "<!-- 1 -->Bug fixes · Correções" },
  { message = "^perf", group = "<!-- 2 -->Performance · Desempenho" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring · Refatoração" },
  { message = "^docs", group = "<!-- 4 -->Documentation · Documentação" },
  { message = "^test", group = "<!-- 5 -->Tests · Testes" },
  { message = "^(build|ci)", group = "<!-- 6 -->Build & CI" },
  { message = "^(chore|style)", group = "<!-- 7 -->Chores · Manutenção" },
  { message = "^revert", group = "<!-- 8 -->Reverts" },
  # Anything else (e.g. the pre-0.9.0 "Desktop: ..." subjects) stays out of the changelog.
  { message = ".*", skip = true },
]
