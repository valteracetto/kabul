[package]
name = "kabul-core"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
portable-pty.workspace = true
toml.workspace = true
ureq = "2"
# Nome do item do Keychain do Claude Code por pasta de config (sha256 do caminho).
sha2 = "0.10"
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
vt100 = "0.18"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Um watcher de arquivos por repo (FSEvents / inotify / ReadDirectoryChangesW).
notify = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# No macOS os segredos vão pelo `security` (ver secrets.rs).
[target.'cfg(not(target_os = "macos"))'.dependencies]
keyring = { version = "3", features = ["windows-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Power", "Win32_System_Registry"] }

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
