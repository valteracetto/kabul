# CI: every push to main and every pull request.
# - version: every manifest carries the same version (scripts/version.mjs check)
# - rust: cargo fmt --check, clippy -D warnings and cargo test on macOS and Windows
# - web: npm ci, build and the E2E suite against the mock backend on Linux and macOS (Playwright)
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  version:
    name: Version is in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/version.mjs check

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The Windows port is still in progress (docs/windows.md, "CI no Windows"): the job runs and
    # reports, but does not block merges yet. Remove this line once the Windows block lands.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux
      - name: Placeholder frontend for tauri::generate_context!
        shell: bash
        run: mkdir -p apps/web/dist && touch apps/web/dist/index.html
      - name: cargo fmt
        if: runner.os == 'macOS'
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  web:
    name: Web build and E2E (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: Textos da interface (en e pt-BR)
        run: npm run i18n:check
      - run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (mock backend)
        run: npm run e2e
        env:
          KABUL_E2E_MOCK_ONLY: "1"
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.os }}
          path: apps/web/test-results
          retention-days: 7
