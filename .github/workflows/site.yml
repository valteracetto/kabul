# Landing page (site/) → Cloudflare Pages, project "kabul".
# Runs only on a push to main that touches the site, the screenshots it uses (docs/assets) or this file,
# and by hand (workflow_dispatch). It needs two repository secrets; without them the job builds and checks
# the site but skips the deploy:
#   CLOUDFLARE_API_TOKEN   token with "Cloudflare Pages: Edit" (and "Workers KV Storage: Edit" if the
#                          KV binding is managed from wrangler.toml)
#   CLOUDFLARE_ACCOUNT_ID  the account that owns the Pages project
# See site/README.md.
name: Site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "apps/desktop/src-tauri/icons/source-1024.png"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run test:links

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler pages deploy dist --project-name kabul --branch main --commit-dirty=true

      - name: Deploy skipped
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; the site was built but not deployed."
