# Documentation site (VitePress, docs/) → GitHub Pages.
# Runs only on a push to main that touches the docs (or this file) and on release tags (v*).
# Nothing runs on pull requests or other branches. Enable Pages once in the repository:
# Settings › Pages › Source: "GitHub Actions".
name: Docs

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "last updated" dates come from git history
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install
        working-directory: docs
        run: npm ci
      - name: Build
        working-directory: docs
        env:
          # Project site: https://<owner>.github.io/<repo>/ (use "/" with a custom domain).
          DOCS_BASE: /${{ github.event.repository.name }}/
        run: npm run docs:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
